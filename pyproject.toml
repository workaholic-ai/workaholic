[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "workaholic-ai"
version = "0.4.0a1"
description = "CLI-first task coordination for human operators and autonomous agents."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Pavels Gurskis", email = "pg@ithesion.com" },
]
maintainers = [
  { name = "Pavels Gurskis", email = "pg@ithesion.com" },
]
keywords = [
  "agents",
  "automation",
  "cli",
  "task-management",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]
dependencies = [
  "platformdirs>=4.11.0,<4.12.0",
  "pydantic>=2.13.4,<2.14.0",
  "typer>=0.27.0,<0.28.0",
]

[project.urls]
Documentation = "https://github.com/workaholic-ai/workaholic/tree/main/docs"
Issues = "https://github.com/workaholic-ai/workaholic/issues"
Repository = "https://github.com/workaholic-ai/workaholic"

[project.scripts]
workaholic = "workaholic.composition:main"

[dependency-groups]
dev = [
  "actionlint-py>=1.7.12.24,<1.8.0",
  "import-linter>=2.13.0,<2.14.0",
  "markdown-it-py>=4.2.0,<5.0.0",
  "mypy>=2.3.0,<2.4.0",
  "pre-commit>=4.6.0,<5.0.0",
  "pytest>=9.1.1,<10.0.0",
  "pytest-cov>=7.1.0,<8.0.0",
  "pyyaml>=6.0.3,<7.0.0",
  "ruff>=0.15.22,<0.16.0",
  "shellcheck-py>=0.11.0.1,<0.12.0.0",
  "types-pyyaml>=6.0.12.20260518,<7.0.0",
]

[tool.hatch.build.targets.sdist]
include = [
  "/.editorconfig",
  "/.github",
  "/.markdownlint-cli2.yaml",
  "/.pre-commit-config.yaml",
  "/.python-version",
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/docs",
  "/pyproject.toml",
  "/scripts",
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workaholic"]

[tool.coverage.paths]
source = [
  "src/workaholic",
  "*/site-packages/workaholic",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
precision = 2
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
relative_files = true
source = ["workaholic"]

[tool.mypy]
enable_error_code = [
  "deprecated",
  "exhaustive-match",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
]
exclude = ["^tests/contract/fixtures/"]
files = [
  "scripts",
  "src",
  "tests",
]
pretty = true
python_version = "3.14"
show_error_code_links = true
strict = true
warn_unreachable = true

[tool.importlinter]
exclude_type_checking_imports = false
root_package = "workaholic"

[[tool.importlinter.contracts]]
id = "package-layers"
name = "Domain and application dependency direction"
type = "layers"
containers = ["workaholic"]
layers = [
  "composition",
  "cli : tui : server : session : persistence : protocol : client : context",
  "application : auth",
  "domain",
]
exhaustive = true
exhaustive_ignores = ["__main__"]

[[tool.importlinter.contracts]]
id = "cli-session-boundary"
name = "CLI presentation uses sessions instead of application adapters"
type = "forbidden"
source_modules = ["workaholic.cli"]
forbidden_modules = [
  "workaholic.application",
  "workaholic.client",
  "workaholic.persistence",
  "workaholic.protocol",
  "workaholic.server",
]
allow_indirect_imports = true

[tool.pytest.ini_options]
addopts = [
  "--cov=workaholic",
  "--cov-branch",
  "--cov-fail-under=95",
  "--cov-report=term-missing:skip-covered",
  "--strict-config",
  "--strict-markers",
  "-ra",
]
filterwarnings = ["error"]
markers = [
  "contract: observable behavior shared across implementations or boundaries",
  "e2e: end-to-end behavior through supported user-facing interfaces",
  "golden: canonical product-journey acceptance specification",
  "integration: behavior spanning multiple real components",
  "requires_network: test opens network connections or accesses a registry",
  "requires_postgres: test requires an isolated PostgreSQL service",
  "requires_uv: test invokes the external uv or uvx executable",
]
pythonpath = ["."]
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
line-length = 88
src = [
  "scripts",
  "src",
  "tests",
]
target-version = "py314"

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
ignore = [
  "D203",
  "D213",
  "ISC001",
]
select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "D",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "INP",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "T10",
  "T20",
  "TC",
  "TRY",
  "UP",
  "W",
  "YTT",
]

[tool.ruff.lint.per-file-ignores]
"src/workaholic/cli/main.py" = [
  "FBT001",
  "FBT002",
]
"tests/**/*.py" = [
  "INP001",
  "PLR2004",
  "S101",
  "S603",
]
