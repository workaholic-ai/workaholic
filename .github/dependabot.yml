version: 2

updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Riga
    open-pull-requests-limit: 5
    labels:
      - "area:release"
      - "kind:refactor"
      - "priority:p2"
      - "status:ready"
    commit-message:
      prefix: deps
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Riga
    open-pull-requests-limit: 3
    labels:
      - "area:release"
      - "kind:refactor"
      - "priority:p2"
      - "status:ready"
    commit-message:
      prefix: deps
    groups:
      pre-commit-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Europe/Riga
    open-pull-requests-limit: 3
    labels:
      - "area:release"
      - "kind:refactor"
      - "priority:p2"
      - "status:ready"
    commit-message:
      prefix: deps
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
