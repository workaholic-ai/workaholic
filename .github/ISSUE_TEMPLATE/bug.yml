name: Bug report
description: Report reproducible behavior that differs from the documented contract.
title: "[Bug]: "
labels:
  - "kind:bug"
  - "priority:p2"
  - "status:needs-design"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Workaholic AI.

        Do not disclose an unpatched vulnerability, credential, private key,
        access token, production data, or personal information here. Follow the
        [private security-reporting process](https://github.com/workaholic-ai/workaholic/security/policy)
        instead.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Select the closest ownership area; maintainers will apply the matching label.
      options:
        - "area:domain"
        - "area:cli"
        - "area:context"
        - "area:auth"
        - "area:server"
        - "area:storage"
        - "area:release"
        - "area:docs"
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Version or revision
      description: Give the package version or full Git commit SHA where the problem occurs.
      placeholder: "0.0.0 or 0123456789abcdef..."
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Give the operating system, Python version, and installation method.
      placeholder: "macOS 15, CPython 3.14, uv sync"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest deterministic sequence that reproduces the problem using non-sensitive data.
      placeholder: |
        1. Run ...
        2. Observe ...
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the documented or intended result.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what happened, including the complete non-sensitive error message.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Add relevant logs or traces after removing secrets, credentials, tokens, paths, and personal or production data.
      render: text

  - type: checkboxes
    id: confirmation
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for the same behavior.
          required: true
        - label: This report contains no secrets, credentials, unpatched vulnerability details, production data, or unnecessary personal information.
          required: true
